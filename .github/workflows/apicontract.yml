# =============================================================================
# apicontract.yml — API Contract Verification
#
# Runs on every pull request and on every v* tag push. Installs Mage, runs
# `mage verify` to confirm API schemas and generated artifacts are consistent,
# and uploads the CRD bases as a release artifact on tag pushes.
# =============================================================================
name: API Contracts

on:
  push:
    branches-ignore:
      - main
      - develop
      - "release/**"
      - "sync/**"
    tags:
      - "v*"
permissions:
  contents: read

jobs:
  verify:
    name: Verify contracts
    runs-on: self-hosted
    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@v7

      - name: Install mage
        run: |
          go install github.com/magefile/mage@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify contracts
        run: mage verify

      - name: Upload CRDs
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: crds-${{ github.ref_name }}
          path: config/crd/bases

      - name: API Contract Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 📜 API Contract Verification
          ## Completed
            - Checked out repository sources
            - Installed Go toolchain
            - Installed Mage
            - Executed \`mage verify\`
          ## Validation Scope The verification process ensures:
            - API schemas are valid
            - Generated artifacts are up to date
            - Contract definitions remain consistent - CRDs can be generated successfully
          EOF

      - name: Release Artifact Summary
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
           ## Release Artifacts Release tag detected: \`${{ github.ref_name }}\`
          Uploaded: - Kubernetes CRDs from \`config/crd/bases\` These artifacts represent the API contract published with this release.
          EOF
