# =============================================================================
# sync-crds.yml — Sync CRDs into environments-install (admin bot)
#
# Generates the CRD manifests of this release (mage manifests into
# config/crd/bases) and propagates them into blanketops/environments-install
# config/crd/bases through the admin bot of environments-bots. The bot writes
# as the BlanketOps Environments Admin App: a GitHub-signed commit on a sync/*
# branch, a pull request into install's main, merged as a merge commit, so
# install's protect ruleset accepts it with no bypass. It is idempotent: when
# install already matches, it opens nothing.
#
# Triggers: a v* tag push (syncs that release; finalize-release creates the tag
# with an App token, so the push starts workflows), or manual dispatch (syncs
# the dispatched ref; dry-run, on by default, reports what would change
# without writing). Not `release: published`: this repo's release.yml does not
# create a GitHub release.
#
# Secrets/variables: ADMIN_APP_PRIVATE_KEY (secret) and ADMIN_CLIENT_ID
# (variable) of the Admin App, which needs Contents and Pull requests: write
# on environments-install. The admin binary is downloaded from the
# environments-bots release and verified with cosign before it runs.
# =============================================================================
name: Sync CRDs into environments-install
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Read only: report what would change, write nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: admin-sync-crds
  cancel-in-progress: false

jobs:
  sync-crds:
    name: admin sync (CRDs)
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate CRD manifests
        run: mage manifests

      - name: admin sync
        uses: blanketops/environments-bots/.github/actions/admin@v0.1.1
        with:
          source-dir: config/crd/bases
          dest-path: config/crd/bases
          label: "CRDs from environments-api ${{ github.ref_name }}"
          dry-run: ${{ inputs.dry-run && 'true' || 'false' }}
          client-id: ${{ vars.ADMIN_CLIENT_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}
