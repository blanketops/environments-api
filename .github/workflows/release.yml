# =============================================================================
# release.yml — Build, Sign and Publish a Release (environments-api / CRDs)
#
# Tag-triggered release pipeline. Generates manifests (mage manifests via controller-gen),
# packages CRDs, generates SBOMs, signs files with Cosign (keyless/OIDC),
# generates GitHub build-provenance attestations, and publishes a GitHub Release
# with all assets and signatures attached directly via the runner-baked `gh` CLI.
# =============================================================================
name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write     # Required for Sigstore keyless OIDC signing
  attestations: write # Required for GitHub native build provenance attestations

jobs:
  release:
    runs-on: self-hosted
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_ID_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments-api

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate & package CRDs
        run: |
          mage manifests
          tar -czf "crds-${{ github.ref_name }}.tar.gz" -C config/crd/bases .

      - name: Generate SPDX SBOM
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          syft dir:. -o spdx-json="sbom-${VERSION}.spdx.json"

      - name: Sign artifacts with Cosign (keyless OIDC)
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          for f in "godoc-${VERSION}.tar.gz" "coverage-${VERSION}.tar.gz" "sbom-${VERSION}.spdx.json"; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            godoc-${{ steps.version.outputs.tag }}.tar.gz
            coverage-${{ steps.version.outputs.tag }}.tar.gz
            sbom-${{ steps.version.outputs.tag }}.spdx.json

      - name: Sign Artifacts with Cosign (Keyless - using runner binary)
        run: |
          cosign sign-blob --yes \
            --output-signature crds-${{ github.ref_name }}.tar.gz.sig \
            crds-${{ github.ref_name }}.tar.gz

          cosign sign-blob --yes \
            --output-signature sbom-crds-${{ github.ref_name }}.spdx.json.sig \
            sbom-crds-${{ github.ref_name }}.spdx.json

      - name: Generate GitHub Native Artifact Attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            crds-${{ github.ref_name }}.tar.gz
            sbom-crds-${{ github.ref_name }}.spdx.json

      - name: Generate release notes
        run: git-cliff --config .cliff.toml --latest --output RELEASE_NOTES.md

      - name: Create GitHub Release & Attach Assets via GitHub CLI (`gh`)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            crds-${{ github.ref_name }}.tar.gz \
            crds-${{ github.ref_name }}.tar.gz.sig \
            sbom-crds-${{ github.ref_name }}.spdx.json \
            sbom-crds-${{ github.ref_name }}.spdx.json.sig \
            RELEASE_NOTES.md

      - name: Release Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # 📦 Secure CRD Release Published: ${{ github.ref_name }}

          ## Completed
          - Generated CRD manifests via `mage manifests`
          - Packaged CRDs into `crds-${{ github.ref_name }}.tar.gz`
          - Generated quota-safe SPDX SBOM (`sbom-crds-${{ github.ref_name }}.spdx.json`)
          - Signed all artifacts with runner-baked Cosign keyless OIDC
          - Generated GitHub build-provenance attestations
          - Published GitHub Release with archives, signatures, and release notes attached via `gh`

          ## Attached Assets
          - `crds-${{ github.ref_name }}.tar.gz` (+ `.sig`)
          - `sbom-crds-${{ github.ref_name }}.spdx.json` (+ `.sig`)
          - `RELEASE_NOTES.md`

          ## Verification Commands
          - **Sig Verification:** 
            `cosign verify-blob --certificate-identity-regexp ".*" --cert-oidc-issuer "https://token.actions.githubusercontent.com" --signature crds-${{ github.ref_name }}.tar.gz.sig crds-${{ github.ref_name }}.tar.gz`
          - **Attestation Verification:** 
            `gh attest verify crds-${{ github.ref_name }}.tar.gz --owner ${{ github.repository_owner }}`
          EOF

      - name: Releaser complete
        if: always()
        uses: blanketops/environments-bots/.github/actions/releaser@v0.1.0
        with:
          command: complete
          release: ${{ github.ref_name }}
          app-id: ${{ vars.DEVELOPER_CLIENT_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
