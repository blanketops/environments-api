name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        runs-on: self-hosted

        steps:
            - name: Checkout tag
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install git-cliff
              run: |
                  curl -L https://github.com/orhun/git-cliff/releases/download/v2.4.0/git-cliff-2.4.0-x86_64-unknown-linux-gnu.tar.gz -o cliff.tar.gz
                  tar -xzf cliff.tar.gz
                  sudo mv git-cliff-2.4.0/git-cliff /usr/local/bin/git-cliff

            - name: Checkout main
              run: |
                  git checkout main
                  git pull origin main

            # CHANGELOG.md is generated and committed by finalize-release.yml, before
            # the tag is created. This workflow only reads it: it makes no commit of its
            # own.
            - name: Generate release notes
              run: git-cliff --config .cliff.toml --latest --output RELEASE_NOTES.md

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  body_path: RELEASE_NOTES.md
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Release Summary
              run: |
                  cat >> $GITHUB_STEP_SUMMARY <<EOF
                  # 📦 GitHub Release Published

                  **Version:** \`${{ github.ref_name }}\`

                  ## Completed

                  - Generated CHANGELOG.md using git-cliff
                  - Committed changelog updates to main
                  - Generated release notes
                  - Published GitHub Release

                  ## Artifacts

                  - CHANGELOG.md
                  - RELEASE_NOTES.md
                  - GitHub Release

                  ## Source Tag

                  \`${{ github.ref_name }}\`

                  EOF

            # The releaser (blanketops/environments-bots, as the Releaser App)
            # attaches the tag and the published release to the Release issue,
            # closes it and sets it to Done. It runs even when a step above
            # failed: it then finds no published release, says so on the
            # issue, and leaves it open.
            - name: Releaser complete
              if: always()
              uses: blanketops/environments-bots/.github/actions/releaser@v0.0.2
              with:
                  command: complete
                  release: ${{ github.ref_name }}
                  app-id: ${{ secrets.RELEASER_APP_ID }}
                  private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
